[project]
name = "market-radar"
version = "0.5.0"
description = "Market intelligence and product hunting for Mercado Livre"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "streamlit>=1.48,<2",
  "pandas>=2.3,<3",
]
[project.optional-dependencies]
test = ["pytest>=8.4,<9"]
[tool.pytest.ini_options]
pythonpath = ["src"]
